<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>

  <main class="app">
    <form class="search glass" id="search-form" autocomplete="off">
      <input id="search-input" type="search" placeholder="Search for a city" aria-label="Search for a city">
      <ul class="results glass" id="results" hidden></ul>
    </form>

    <section class="current glass" aria-live="polite">
      <p class="location" id="location">Boca Raton</p>
      <p class="temp" id="temp">--°</p>
      <p class="condition" id="condition">Loading…</p>
      <p class="hilo" id="hilo"></p>
    </section>

    <section class="details glass">
      <div><span>Feels like</span><strong id="feels">--</strong></div>
      <div><span>Humidity</span><strong id="humidity">--</strong></div>
      <div><span>Wind</span><strong id="wind">--</strong></div>
      <div><span>UV index</span><strong id="uv">--</strong></div>
    </section>

    <section class="glass">
      <h2>Hourly forecast</h2>
      <div class="hourly" id="hourly"></div>
    </section>

    <section class="glass">
      <h2>7-day forecast</h2>
      <ul class="daily" id="daily"></ul>
    </section>

    <footer>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
